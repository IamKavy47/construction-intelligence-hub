<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Intelligence Hub</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#FAF9F5',
                        surface: '#F4F1EA',
                        border: '#E8E2D7',
                        primary: '#D97757',
                        primaryHover: '#C86442',
                        textMain: '#2F2B27',
                        muted: '#726B63',
                        success: '#5B8A72',
                        warning: '#C18B3B',
                        danger: '#B95D4C',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(47, 43, 39, 0.05)',
                        'float': '0 8px 30px -4px rgba(47, 43, 39, 0.1)',
                    }
                }
            }
        }
    </script>

    <!-- Libraries -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="./styles.css">

</head>
<body class="h-screen w-full overflow-hidden flex selection:bg-primary selection:text-white">

    <!-- Welcome Screen (Before Project Creation) -->
    <div id="welcome-screen" class="absolute inset-0 z-50 bg-background flex flex-col items-center justify-center">
        <div class="max-w-md w-full text-center space-y-6">
            <div class="w-16 h-16 bg-surface border border-border rounded-2xl flex items-center justify-center mx-auto shadow-premium">
                <i data-lucide="layers" class="text-primary w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-2xl font-semibold mb-2">Construction Intelligence Hub</h1>
                <p class="text-muted text-sm">AI-Powered Construction Project Intelligence Platform.</p>
            </div>
            <button onclick="App.openWizard()" class="bg-textMain text-surface px-6 py-3 rounded-lg w-full font-medium hover:bg-black transition-colors flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> New Project
            </button>
        </div>
    </div>

    <!-- Main App Layout (Hidden Initially) -->
    <div id="app-layout" class="flex h-full w-full opacity-0 pointer-events-none transition-opacity duration-500">
        
        <!-- Sidebar -->
        <aside class="w-64 border-r border-border bg-background flex flex-col flex-shrink-0 h-full">
            <div class="h-16 flex items-center px-6 border-b border-border">
                <div class="flex items-center gap-2 text-textMain font-semibold">
                    <i data-lucide="layers" class="text-primary w-5 h-5"></i>
                    <span>Intelligence Hub</span>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="nav-menu">
                <!-- Populated by JS -->
            </div>

            <div class="p-4 border-t border-border">
                <div class="flex items-center gap-3 bg-surface p-3 rounded-xl border border-border cursor-pointer hover:border-muted transition-colors">
                    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white font-medium text-sm">JD</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate">John Doe</p>
                        <p class="text-xs text-muted truncate">Principal Architect</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-background">
            
            <!-- Top Header -->
            <header class="h-16 border-b border-border bg-background/80 backdrop-blur-md flex items-center justify-between px-6 flex-shrink-0 z-10">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-surface px-3 py-1.5 rounded-md border border-border cursor-pointer" onclick="App.openWizard()">
                        <div class="w-2 h-2 rounded-full bg-success"></div>
                        <span id="header-project-name" class="text-sm font-medium">Select Project</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-muted"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <!-- Demo Trigger for Cross-Module Intelligence -->
                    <button onclick="App.simulateEvent()" class="text-xs font-medium text-warning bg-warning/10 px-3 py-1.5 rounded-md border border-warning/20 hover:bg-warning/20 transition flex items-center gap-1">
                        <i data-lucide="zap" class="w-3 h-3"></i> Simulate Event
                    </button>

                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
                        <input type="text" placeholder="Search across project..." class="pl-9 pr-4 py-1.5 bg-surface border border-border rounded-md text-sm focus:outline-none focus:border-primary w-64 transition-colors placeholder:text-muted/70">
                    </div>
                    
                    <button class="relative p-2 text-muted hover:text-textMain transition-colors">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-danger rounded-full border border-background"></span>
                    </button>
                </div>
            </header>

            <!-- Dynamic Workspace -->
            <div id="workspace" class="flex-1 overflow-y-auto p-6 pb-32">
                <!-- Module content injected here -->
            </div>

            <!-- Persistent AI Copilot Bar -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[600px] max-w-[90%] z-20">
                <div class="glass-panel rounded-2xl shadow-float p-2 flex flex-col gap-2 transition-all duration-300" id="ai-bar-container">
                    
                    <div class="flex items-center px-2 pt-1 gap-2 overflow-x-auto hide-scrollbar" id="ai-suggestions">
                        <span class="text-xs font-medium text-muted flex-shrink-0">Suggestions:</span>
                        <!-- Suggestions populated by JS -->
                    </div>

                    <div id="ai-attachments" class="hidden px-2 flex flex-wrap gap-2"></div>

                    <div class="flex items-center bg-background rounded-xl border border-border p-1 pl-2">
                        <input type="file" id="ai-file-input" class="hidden" accept=".pdf,.doc,.docx,.dwg,.dxf,.xls,.xlsx,.png,.jpg,.jpeg,.csv" multiple onchange="App.handleDocumentUpload(event)">
                        <button type="button" onclick="document.getElementById('ai-file-input').click()" class="p-2 text-muted hover:text-primary transition-colors rounded-lg hover:bg-surface flex-shrink-0" title="Upload document">
                            <i data-lucide="paperclip" class="w-4 h-4"></i>
                        </button>
                        <i data-lucide="sparkles" class="w-5 h-5 text-primary flex-shrink-0"></i>
                        <input type="text" id="ai-input" placeholder="Ask Construction Copilot or upload a document..." class="flex-1 bg-transparent border-none focus:outline-none text-sm px-3 py-2 placeholder:text-muted">
                        <button onclick="App.submitAIChat()" class="bg-textMain text-surface p-2 rounded-lg hover:bg-black transition-colors flex-shrink-0">
                            <i data-lucide="arrow-up" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Project Setup Wizard Overlay -->
    <div id="wizard-overlay" class="fixed inset-0 z-[100] bg-textMain/20 backdrop-blur-sm hidden flex items-center justify-center opacity-0 transition-opacity">
        <div class="bg-background w-[800px] max-h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-border">
            
            <!-- Wizard Header -->
            <div class="px-6 py-4 border-b border-border flex justify-between items-center bg-surface">
                <div>
                    <h2 class="text-lg font-semibold">Project Intelligence Setup</h2>
                    <p class="text-sm text-muted">Configure AI parameters and project baselines.</p>
                </div>
                <button onclick="App.closeWizard()" class="p-2 text-muted hover:bg-border rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Wizard Body -->
            <div class="flex flex-1 overflow-hidden">
                <!-- Steps Sidebar -->
                <div class="w-1/3 border-r border-border bg-surface/50 p-6 overflow-y-auto" id="wizard-steps">
                    <!-- Populated by JS -->
                </div>
                
                <!-- Form Area -->
                <div class="w-2/3 p-8 overflow-y-auto relative bg-background" id="wizard-form-area">
                    <!-- Steps injected here -->
                </div>
            </div>

            <!-- Wizard Footer -->
            <div class="px-6 py-4 border-t border-border flex justify-between items-center bg-surface">
                <button id="wizard-prev" class="px-4 py-2 text-sm font-medium text-muted hover:text-textMain hidden">Back</button>
                <div class="flex-1"></div>
                <button id="wizard-next" class="px-6 py-2 text-sm font-medium bg-textMain text-surface rounded-lg hover:bg-black transition-colors">Next Step</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
